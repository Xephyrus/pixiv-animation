name: test-and-build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, curl, zip, mbstring, gd
          coverage: none

      - name: 语法检查
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './downloads/*' -not -path './data/*' -print0 \
            | xargs -0 -n1 php -l

      - name: 启动服务并做冒烟测试
        run: |
          set -euo pipefail
          export DB_PATH="$PWD/data/ci.db"
          php -S 127.0.0.1:8080 router.php > /tmp/php-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health -o /tmp/health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done

          cat /tmp/php-server.log
          test "$ready" = "1"
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

          curl -fsS 'http://127.0.0.1:8080/api/list' -o /tmp/list.json
          grep -q '"success":true' /tmp/list.json
          curl -fsS 'http://127.0.0.1:8080/' -o /tmp/index.html
          grep -q 'Pixiv Animation' /tmp/index.html
          curl -fsS 'http://127.0.0.1:8080/download' -o /tmp/download.html
          grep -q '抓取下载' /tmp/download.html
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/api/works/999999999')" = "404"

          mkdir -p downloads/thumb-test
          php -r '$im = imagecreatetruecolor(800, 600); imagefilledrectangle($im, 0, 0, 799, 599, imagecolorallocate($im, 200, 120, 60)); imagejpeg($im, "downloads/thumb-test/000000.jpg", 90);'
          thumb_status="$(curl -s -o /tmp/thumb.jpg -w '%{http_code}' 'http://127.0.0.1:8080/thumb/thumb-test/000000.jpg?w=64')"
          echo "thumb status=${thumb_status}"
          test "$thumb_status" = "200"
          php -r '$info = getimagesize("/tmp/thumb.jpg"); if ($info === false) { fwrite(STDERR, "不是有效图片\n"); exit(1); } echo "thumb {$info[0]}x{$info[1]}\n"; exit($info[0] === 64 ? 0 : 1);'
          test -f "downloads/.thumbs/thumb-test/w64_000000.jpg"

      - name: 元数据写入测试
        run: |
          set -euo pipefail
          export DB_PATH="$PWD/data/ci.db"
          mkdir -p downloads/999999999_ugoira1920x1080
          for frame in 000000 000001 000002; do
            printf 'x' > "downloads/999999999_ugoira1920x1080/${frame}.jpg"
          done
          php scripts/sync.php
          printf '%s' '{"error":false,"message":"","body":{"src":"https://example.com/a.zip","originalSrc":"https://example.com/b.zip","mime_type":"image/jpeg","frames":[{"file":"000000.jpg","delay":80},{"file":"000001.jpg","delay":50},{"file":"000002.jpg","delay":50}]}}' > /tmp/meta-999999999.json
          php scripts/import_meta_json.php /tmp/meta-999999999.json
          php -r '$pdo = new PDO("sqlite:" . getenv("DB_PATH")); $stmt = $pdo->prepare("SELECT meta_json FROM works WHERE id = ?"); $stmt->execute([(string) 999999999]); $meta = json_decode((string) $stmt->fetchColumn(), true); exit(($meta["frames"][0]["delay"] ?? 0) === 80 && ($meta["src"] ?? "") === "https://example.com/a.zip" ? 0 : 1);'
          php -r 'require "src/bootstrap.php"; app_db()->updateWorkInfo("999999999", ["character" => "测试角色", "tags" => ["A", "B"]]); $work = app_db()->getWork("999999999"); exit(($work["character"] ?? "") === "测试角色" && ($work["tags"] ?? []) === ["A", "B"] ? 0 : 1);'

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pixiv-animation:ci

      - name: 运行容器并做健康检查
        run: |
          set -euo pipefail
          docker run -d --name pixiv-animation-ci -p 5400:5400 pixiv-animation:ci
          trap 'docker rm -f pixiv-animation-ci >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5400/api/health -o /tmp/docker-health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done

          docker logs pixiv-animation-ci
          test "$ready" = "1"
          cat /tmp/docker-health.json
          grep -q '"ok":true' /tmp/docker-health.json
